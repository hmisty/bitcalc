name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx grunt

      - name: Prepare deployment
        run: |
          mkdir -p _deploy
          cp bitcalc.html _deploy/index.html
          cp README.md _deploy/
          echo bitcalc.blockcoach.com > _deploy/CNAME

      - name: Ensure GitHub Pages is enabled
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages)
          if [ "$HTTP_CODE" = "404" ]; then
            echo "GitHub Pages not enabled. Enabling now..."
            RESP=$(curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/pages \
              -d '{"source":{"branch":"main","path":"/"}}')
            echo "Response: $RESP"
            if echo "$RESP" | grep -q '"status":.*"built"'; then
              echo "Pages enabled successfully!"
            else
              echo "Pages may already be enabled or there was an issue."
            fi
          else
            echo "GitHub Pages is already enabled."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
